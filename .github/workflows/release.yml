# Creates a GitHub release for an existing tag and attaches the plugin zip.
#
# Run it from the Actions tab after pushing a tag (for example 1.0.9).
# The release is titled "v<version>", its notes are that version's entry in the
# readme.txt changelog, and the zip is built from the tagged files the same way
# the wp.org zip is: production Composer autoloader, no dev or repo-only files.
name: Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to release, for example 1.0.9"
        required: true
        type: string
      release_date:
        description: "Optional original release date (YYYY-MM-DD), shown in the notes for a release published late"
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ inputs.tag }}
  cancel-in-progress: false

env:
  SLUG: axiom-blocks

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the tag
        uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ inputs.tag }}

      - name: Check the tag matches the plugin version
        id: version
        env:
          TAG: ${{ inputs.tag }}
        run: |
          version="${TAG#v}"
          header=$(tr -d '\r' < "$SLUG.php" | sed -n 's/^[ *]*Version:[[:space:]]*\([^[:space:]]*\).*/\1/p' | head -n 1)
          stable=$(tr -d '\r' < readme.txt | sed -n 's/^Stable tag:[[:space:]]*\([^[:space:]]*\).*/\1/p' | head -n 1)
          echo "Tag: $TAG  Plugin header: $header  Stable tag: $stable"
          if [ "$header" != "$version" ] || [ "$stable" != "$version" ]; then
            echo "::error::Tag $TAG does not match the plugin header ($header) and readme Stable tag ($stable)."
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Write the release notes from the changelog
        env:
          VERSION: ${{ steps.version.outputs.version }}
          RELEASE_DATE: ${{ inputs.release_date }}
        run: |
          if [ -n "$RELEASE_DATE" ] && { ! [[ "$RELEASE_DATE" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}$ ]] || [ "$(date -d "$RELEASE_DATE" +%F 2>/dev/null)" != "$RELEASE_DATE" ]; }; then
            echo "::error::release_date must be a date like 2026-09-06, got '$RELEASE_DATE'."
            exit 1
          fi
          tr -d '\r' < readme.txt | awk -v v="$VERSION" '
            /^== / { inlog = ($0 == "== Changelog ==") ; next }
            inlog && $0 == "= " v " =" { found = 1; next }
            found && /^= / { exit }
            found { print }
          ' | sed 's/^\* /- /' | sed -e '/./,$!d' > changes.md
          if ! grep -q '[^[:space:]]' changes.md; then
            echo "::error::readme.txt has no changelog entry for $VERSION."
            exit 1
          fi
          {
            printf '## Released Version %s\n\n' "$VERSION"
            if [ -n "$RELEASE_DATE" ]; then
              printf '_Released on %s._\n\n' "$(date -d "$RELEASE_DATE" '+%B %-d, %Y')"
            fi
            cat changes.md
          } > notes.md
          cat notes.md

      - name: Set up PHP and Composer
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.1"
          tools: composer
          coverage: none

      - name: Install the production autoloader
        run: composer install --no-dev --optimize-autoloader --no-interaction --prefer-dist

      - name: Check the built plugin is complete
        run: |
          missing=0
          for path in "$SLUG.php" readme.txt build/index.js inc vendor/autoload.php assets/admin; do
            if [ ! -e "$path" ]; then
              echo "::error::$path is missing from the tagged files."
              missing=1
            fi
          done
          exit $missing

      - name: Build the zip
        id: zip
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          # Mirrors the private .distignore: repo, lint and release tooling stay out.
          mkdir -p "dist/$SLUG"
          rsync -a \
            --exclude='.git' \
            --exclude='/.github' \
            --exclude='/.releasekeep' \
            --exclude='/.distignore' \
            --exclude='/.gitignore' \
            --exclude='/.publicignore' \
            --exclude='/.eslintrc.js' \
            --exclude='/.stylelintrc.json' \
            --exclude='/.phpcs.xml.dist' \
            --exclude='/phpcs.xml' \
            --exclude='/README.md' \
            --exclude='/composer.lock' \
            --exclude='/package-lock.json' \
            --exclude='node_modules' \
            --exclude='/dist' \
            --exclude='/changes.md' \
            --exclude='/notes.md' \
            --exclude='/scripts/make-zip.js' \
            --exclude='/.claude' \
            --exclude='/.agents' \
            --exclude='/.wordpress-org' \
            --exclude='/.svn-deploy' \
            --exclude='/.mcp.json' \
            --exclude='/skills-lock.json' \
            --exclude='/CLAUDE.md' \
            --exclude='/_dev' \
            --exclude='/scripts/.release-state.json' \
            --exclude='/scripts/release.js' \
            --exclude='/scripts/svn-deploy.js' \
            --exclude='/scripts/sync-to-public.js' \
            --exclude='*.pdf' \
            --exclude='*.csv' \
            --exclude='*.log' \
            --exclude='*.zip' \
            ./ "dist/$SLUG/"
          zip_name="$SLUG-$VERSION.zip"
          (cd dist && zip -qr9 "../$zip_name" "$SLUG")
          unzip -l "$zip_name" | tail -n 1
          echo "name=$zip_name" >> "$GITHUB_OUTPUT"

      - name: Create or update the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
          VERSION: ${{ steps.version.outputs.version }}
          ZIP: ${{ steps.zip.outputs.name }}
        run: |
          if gh release view "$TAG" > /dev/null 2>&1; then
            echo "Release $TAG exists, updating its notes and zip."
            gh release edit "$TAG" --title "v$VERSION" --notes-file notes.md
            gh release upload "$TAG" "$ZIP" --clobber
          else
            gh release create "$TAG" "$ZIP" --verify-tag --title "v$VERSION" --notes-file notes.md
          fi
